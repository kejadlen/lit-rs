[package]
name = "lit"
version = "0.1.0"
edition = "2024"

[dependencies]
camino = "*"
clap = { version = "*", features = ["derive"] }
fs-err = "*"
jaq-core = "3.1.2"
jaq-json = { version = "2.0.3", features = ["serde"] }
jaq-std = "3.0.4"
markdown = "*"
miette = { version = "*", features = ["fancy"] }
petgraph = "*"
regex = "*"
serde_json = { version = "*", features = ["preserve_order"] }
serde_norway = "*"
thiserror = "*"
toml = { version = "*", features = ["preserve_order"] }
tracing = "*"
tracing-subscriber = { version = "*", features = ["env-filter"] }
url = "*"
walkdir = "*"

[dev-dependencies]
tempfile = "*"

[lints.clippy]
self_named_module_files = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
